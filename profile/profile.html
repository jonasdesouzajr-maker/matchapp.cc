<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030101">
    
    <title>MatchApp | My Private Streaming Hub</title>
    <meta name="robots" content="index, follow">

    <!-- GOOGLE ANALYTICS (GTAG) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ECND229RR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-2ECND229RR');
    </script>
    
    <!-- GOOGLE ADSENSE SCRIPT ENGINE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9541435081010948" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #E5C158; --gold-glow: #FFF0B3; --bg-dark: #030101; --card-bg: rgba(10, 2, 2, 0.95); }
        body { margin: 0; background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; background: rgba(3,1,1,0.98); border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .main-layout { display: flex; width: 100%; max-width: 1500px; margin: 0 auto; gap: 20px; justify-content: center; padding-top: 30px; min-height: 80vh; }
        .container { flex: 1; max-width: 850px; width: 100%; padding-bottom: 50px; }

        .premium-card { background: var(--card-bg); border: 1px solid var(--gold); border-radius: 20px; padding: 35px; margin-bottom: 30px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .input-group label { color: #ccc; font-size: 14px; font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #000; color: #fff; font-size: 16px; }
        
        #portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .poster-card { position: relative; width: 100%; height: 230px; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .poster-title { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.95)); color: #fff; font-size: 12px; padding: 10px 4px 4px 4px; text-align: center; font-weight: bold; }
        
        .ad-banner-container { text-align: center; margin-bottom: 30px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; border: 1px dashed rgba(255,255,255,0.2); min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="/index.html" style="text-decoration: none; color: var(--gold); font-size: 28px; font-weight: 900;">MatchApp Hub</a>
        <nav style="display: flex; gap: 12px; align-items: center;">
            <a href="/index.html" class="gold-btn" style="padding: 12px 20px; font-size: 14px; text-decoration: none; text-transform: uppercase;">🏠 Home Page</a>
        </nav>
    </header>

    <main class="main-layout">
        <section class="container">
            <article class="premium-card">
                <div style="text-align: center; margin-bottom: 40px;">
                    <label for="avatar-upload" style="cursor: pointer; display: inline-block; position: relative;">
                        <img id="profile-pic-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23E5C158'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" style="width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover;">
                        <input type="file" id="avatar-upload" accept="image/*" style="display: none;" onchange="handleAvatar(event)">
                        <div id="avatar-change-badge" style="position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: #000; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--gold); font-size: 11px; color: var(--gold); white-space: nowrap; font-weight: bold;">Upload Photo</div>
                    </label>
                </div>

                <!-- PROFILE TOP MONETIZATION BANNER -->
                <div class="ad-banner-container">
                    <span style="font-size: 10px; color: #888; display: block; margin-bottom: 5px;">SPONSORED ADVERTISEMENT</span>
                    <ins class="adsbygoogle" style="display:block; min-height: 90px;" data-ad-client="ca-pub-9541435081010948" data-ad-slot="2595698117" data-ad-format="auto" data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
                
                <div style="background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; border: 2px solid rgba(255,82,82,0.4); margin-bottom: 40px;">
                    <h3 style="color: #ff5252; margin: 0 0 15px 0; font-size: 24px; text-transform: uppercase;">🔒 Core Identity (AI Match Brain)</h3>
                    
                    <div id="editable-fields-section">
                        <div class="input-grid">
                            <div class="input-group"><label>Full Name</label><input type="text" id="profile-name"></div>
                            <div class="input-group"><label>Country of Residence</label><input type="text" id="profile-country"></div>
                            <div class="input-group"><label>Birthdate</label><input type="text" id="profile-dob" placeholder="DD/MM/YYYY"></div>
                            <div class="input-group">
                                <label>Star Sign</label>
                                <select id="profile-starsign">
                                    <option value="Aries">Aries</option>
                                    <option value="Taurus">Taurus</option>
                                    <option value="Gemini">Gemini</option>
                                    <option value="Cancer">Cancer</option>
                                    <option value="Leo">Leo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="save-profile-btn" onclick="saveProfileData()" class="gold-btn" style="width: 100%; padding: 22px; font-size: 22px; margin-bottom: 40px;">💾 Save & Lock Identity</button>

                <div style="background: rgba(229,193,88,0.05); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); margin-bottom: 40px;">
                    <h3 style="color: var(--gold); margin: 0 0 25px 0; font-size: 26px; text-transform: uppercase; font-weight: 900;">⭐ Watch Later Portfolio</h3>
                    <div id="portfolio-grid"><p style="color: #aaa; font-size: 15px; font-style: italic;">Your portfolio is empty. Go match!</p></div>
                </div>
            </article>
        </section>
    </main>

    <script src="/app.js?v=102"></script>
    <script src="/profile.js?v=102"></script>
</body>
</html>
