name: Auto-Update Sitemap, Ping Google & Bing IndexNow

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  seo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Clean-URL Sitemap
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          cat << EOF > sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
              <url>
                  <loc>https://matchapp.cc/</loc>
                  <lastmod>${DATE}</lastmod>
                  <changefreq>daily</changefreq>
                  <priority>1.0</priority>
              </url>
              <url>
                  <loc>https://matchapp.cc/pricing</loc>
                  <lastmod>${DATE}</lastmod>
                  <changefreq>weekly</changefreq>
                  <priority>0.8</priority>
              </url>
              <url>
                  <loc>https://matchapp.cc/profile</loc>
                  <lastmod>${DATE}</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.5</priority>
              </url>
          </urlset>
          EOF

      - name: Commit and push updated sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap.yml
          git diff --staged --quiet || git commit -m "🤖 Auto-update clean sitemap timestamp [skip ci]"
          git push

      - name: Ping Google Search Console
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://matchapp.cc/sitemap.xml"
          echo "Google successfully notified of clean URLs!"

      - name: Notify Bing via IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
               -H "Content-Type: application/json; charset=utf-8" \
               -d '{
                     "host": "matchapp.cc",
                     "key": "matchappindexnowkey2026",
                     "keyLocation": "https://matchapp.cc/matchappindexnowkey2026.txt",
                     "urlList": [
                       "https://matchapp.cc/",
                       "https://matchapp.cc/pricing",
                       "https://matchapp.cc/profile"
                     ]
                   }'
          echo "Bing & IndexNow notified of clean URLs!"
