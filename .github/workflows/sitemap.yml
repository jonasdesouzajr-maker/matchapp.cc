name: Ping Google & Bing IndexNow

on:
  push:
    branches: [ main, master ]

jobs:
  seo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Google Search Console
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://matchapp.cc/sitemap.xml"
          echo "Google successfully notified of updates!"

      - name: Notify Bing via IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
               -H "Content-Type: application/json; charset=utf-8" \
               -d '{
                     "host": "matchapp.cc",
                     "key": "matchappindexnowkey2026",
                     "keyLocation": "https://matchapp.cc/matchappindexnowkey2026.txt",
                     "urlList": [
                       "https://matchapp.cc/",
                       "https://matchapp.cc/pricing",
                       "https://matchapp.cc/profile"
                     ]
                   }'
          echo "Bing & IndexNow network successfully notified!"
