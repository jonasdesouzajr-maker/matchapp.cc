name: Automated IndexNow SEO Ping

on:
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8:00 AM UTC
  workflow_dispatch:     # Allows you to trigger manual test runs from GitHub dashboard

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Submit Sitemap URLs to IndexNow
        uses: jakob-bagterp/index-now-submit-sitemap-urls-action@v1
        with:
          host: matchapp.cc
          api_key: ${{ secrets.INDEX_NOW_KEY }}
          sitemap_locations: https://matchapp.cc/sitemap.xml
