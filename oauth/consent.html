<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match App | Authorization Consent</title>
    <!-- Note the relative path '../' since this file is inside the oauth folder -->
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark);">
    <!-- 🌍 ANIMATED BACKGROUND -->
    <div class="luxury-bg"><div class="floating-orb orb-1"></div><div class="floating-orb orb-2"></div></div>

    <div class="container" style="max-width: 480px; text-align: center;">
        <div class="premium-card fade-in" style="padding: 40px 30px; border: 2px solid var(--gold); box-shadow: 0 0 50px rgba(212,175,55,0.2);">
            <div style="font-size: 55px; margin-bottom: 15px; animation: pulseIcon 2s infinite;">🔐</div>
            <h2 style="color: var(--gold); margin-top: 0; font-size: 26px;">MatchApp Authorization</h2>
            <p style="color: #fff; font-size: 14px; line-height: 1.6; margin-bottom: 25px;">
                MatchApp requests secure access to your Google account profile to personalize your streaming concierge experience:
            </p>

            <div style="background: rgba(0,0,0,0.6); padding: 18px; border-radius: 12px; text-align: left; margin-bottom: 25px; border-left: 4px solid var(--gold);">
                <ul style="color: #bbb; font-size: 13px; margin: 0; padding-left: 20px; line-height: 1.8;">
                    <li><strong style="color: #fff;">Email Address:</strong> Used for secure authentication & profile syncing.</li>
                    <li><strong style="color: #fff;">Name & Avatar:</strong> Used for your private dashboard profile card.</li>
                </ul>
            </div>

            <div style="display: flex; gap: 12px; flex-direction: column;">
                <button onclick="window.location.href='../callback.html'" class="gold-btn" style="padding: 16px; font-size: 16px;">Authorize & Continue</button>
                <button onclick="window.location.href='../index.html'" class="secondary-btn" style="border: none; background: transparent; font-size: 13px; color: var(--text-muted);">Cancel & Return Home</button>
            </div>
        </div>
    </div>
</body>
</html>
