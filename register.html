<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/index.html?openAuth=1">
    <link rel="canonical" href="https://matchapp.cc/index.html">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting… | MatchApp</title>
    <script>
        // This page used to run its own separate, parallel sign-up form
        // (its own copy of Google Sign-In, its own email/password handlers)
        // powered by an older, unmaintained script file — completely
        // disconnected from every improvement made to the main sign-up flow
        // since (profile auto-fill from Google, translations, VIP tier
        // logic). It was also unlinked from anywhere else on the site, so
        // nobody actively maintaining the app would have noticed it drifting
        // further out of sync over time — exactly the same "two systems
        // quietly diverge" problem that broke Google Sign-In on the main
        // page earlier. Rather than keep two sign-up UIs in permanent sync
        // forever, anyone who still has this URL bookmarked or linked
        // externally gets sent straight to the one, currently-maintained
        // sign-up flow instead.
        window.location.replace('/index.html?openAuth=1');
    </script>
</head>
<body>
    <p>Redirecting to <a href="/index.html?openAuth=1">MatchApp</a>…</p>
</body>
</html>
