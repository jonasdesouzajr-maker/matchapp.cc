<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchApp | VIP Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="luxury-bg"></div>

    <div class="container" style="max-width: 500px;">
        <header class="app-header">
            <div class="logo" onclick="window.location.href='index.html'">Match<span>App</span></div>
            <button onclick="window.location.href='index.html'" class="secondary-btn" style="padding: 6px 12px; font-size: 12px;">← Back to Home</button>
        </header>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-reg" onclick="switchTab('reg')" class="gold-btn" style="flex: 1; padding: 12px;">⭐ Create VIP</button>
            <button id="tab-log" onclick="switchTab('log')" class="secondary-btn" style="flex: 1; padding: 12px; border: none; background: rgba(20,20,35,0.8);">🔐 Log In</button>
        </div>

        <!-- REGISTRATION SECTION -->
        <div id="sec-reg" class="premium-card fade-in">
            <h2 style="color: var(--gold); margin-top: 0;">Create VIP Profile</h2>
            
            <div class="input-group">
                <label>Full Name *</label>
                <input type="text" id="reg-name" placeholder="Your Name" required>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>Age * (Min 16)</label>
                    <input type="number" id="reg-age" placeholder="25" min="16" required>
                </div>
                <div class="input-group">
                    <label>Country *</label>
                    <input type="text" id="reg-country" placeholder="USA / Brazil" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="reg-email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password * (Min 6 chars)</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Viewing Style</label>
                <select id="reg-viewing">
                    <option value="binge">Binge Watcher</option>
                    <option value="casual">Casual Viewer</option>
                    <option value="weekend">Weekend Enthusiast</option>
                </select>
            </div>

            <button onclick="doRegister()" class="gold-btn" style="margin-top: 10px;">Complete VIP Registration</button>
        </div>

        <!-- LOGIN SECTION -->
        <div id="sec-log" class="premium-card fade-in" style="display: none;">
            <h2 style="color: var(--gold); margin-top: 0;">Existing VIP Login</h2>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="log-email" placeholder="name@example.com">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="log-password" placeholder="••••••••">
            </div>

            <button onclick="doLogin()" class="gold-btn" style="margin-top: 10px;">Access My VIP Account</button>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
