<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchApp | VIP Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="luxury-bg"></div>

    <div class="container" style="max-width: 500px; margin: 30px auto; padding: 20px; position: relative; z-index: 1;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="font-size: 24px; font-weight: 800; color: #fff; cursor: pointer;" onclick="window.location.href='index.html'">Match<span style="color: #D4AF37;">App</span></div>
            <button onclick="window.location.href='index.html'" style="background: transparent; color: #A0A0B5; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; cursor: pointer;">← Home</button>
        </header>

        <div style="background: rgba(20,20,35,0.9); border: 1px solid rgba(212,175,55,0.3); padding: 25px; border-radius: 16px;">
            <h2 style="color: #D4AF37; margin-top: 0;">⭐ VIP Registration</h2>
            
            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase;">Full Name</label>
                <input type="text" id="reg-name" placeholder="Your Name" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase;">Age (Min 16)</label>
                <input type="number" id="reg-age" placeholder="28" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase;">Email Address</label>
                <input type="email" id="reg-email" placeholder="name@example.com" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase;">Password</label>
                <input type="password" id="reg-password" placeholder="••••••••" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <!-- DIRECT INLINE CLICK HANDLER -->
            <button onclick="triggerRegister()" style="width: 100%; background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728); color: #000; border: none; padding: 14px; font-weight: 800; border-radius: 8px; cursor: pointer;">Complete Registration</button>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
