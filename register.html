<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatchApp | VIP Registration & Lifestyle Profile</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase Database CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="luxury-bg"></div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container"></div>

    <div class="container" style="max-width: 600px; margin-top: 20px; margin-bottom: 40px;">
        
        <header class="app-header">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">Match<span>App</span></div>
            <button class="secondary-btn" onclick="window.location.href='index.html'" style="padding: 6px 12px; font-size: 12px;">← Back to Home</button>
        </header>

        <div class="premium-card auth-box" style="padding: 30px;">
            <h2 style="color: var(--gold); margin-top: 0; font-size: 24px; text-align: center;">⭐ Create Your VIP Concierge Profile</h2>
            <p class="subtitle" style="text-align: center;">Tell us about yourself so our algorithm can tailor your cinematic experience.</p>
            
            <form id="register-form">
                
                <!-- SECTION 1: ACCOUNT CREDENTIALS -->
                <div class="form-section-title">1. Account Information</div>
                <div class="input-grid">
                    <div class="input-group">
                        <label>Full Name *</label>
                        <input type="text" id="reg-name" placeholder="Your Name" required>
                    </div>
                    <div class="input-group">
                        <label>Age *</label>
                        <input type="number" id="reg-age" min="1" max="120" placeholder="e.g. 28" required>
                    </div>
                </div>

                <div class="input-grid" style="margin-top: 10px;">
                    <div class="input-group">
                        <label>Email Address *</label>
                        <input type="email" id="reg-email" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password * (Min 6 chars)</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- SECTION 2: LOCATION & DEMOGRAPHICS -->
                <div class="form-section-title" style="margin-top: 20px;">2. Location & Demographics</div>
                <div class="input-grid">
                    <div class="input-group">
                        <label>Country *</label>
                        <input type="text" id="reg-country" placeholder="e.g. Brazil, USA" required>
                    </div>
                    <div class="input-group">
                        <label>City</label>
                        <input type="text" id="reg-city" placeholder="e.g. Rio de Janeiro">
                    </div>
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>Sexual Orientation</label>
                    <select id="reg-orientation">
                        <option value="straight">Heterosexual / Straight</option>
                        <option value="gay">Gay</option>
                        <option value="lesbian">Lesbian</option>
                        <option value="bisexual">Bisexual</option>
                        <option value="pansexual">Pansexual</option>
                        <option value="asexual">Asexual</option>
                        <option value="queer">Queer</option>
                        <option value="questioning">Questioning</option>
                        <option value="other">Other / Self-Describe</option>
                        <option value="prefer_not_to_say" selected>Prefer not to say</option>
                    </select>
                </div>

                <!-- SECTION 3: LIFESTYLE & VIEWING HABITS -->
                <div class="form-section-title" style="margin-top: 20px;">3. Lifestyle & Viewing Habits</div>
                
                <div class="input-group">
                    <label>Viewing Style (Multiple choice / primary habit)</label>
                    <select id="reg-viewing-style">
                        <option value="binge">Binge Watcher (Finish a season in a weekend)</option>
                        <option value="casual">Casual Viewer (1-2 episodes per week)</option>
                        <option value="weekend">Weekend Cinematic Enthusiast</option>
                        <option value="late_night">Late Night Explorer</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>Favorite Genres (Hold Ctrl/Cmd to select multiple)</label>
                    <select id="reg-genres" multiple style="height: 90px;">
                        <option value="Action">Action & Thriller</option>
                        <option value="Comedy">Comedy & Stand-up</option>
                        <option value="Drama">Deep Drama</option>
                        <option value="Sci-Fi">Sci-Fi & Fantasy</option>
                        <option value="Romance">Romance & Telenovelas</option>
                        <option value="Horror">Horror & Mystery</option>
                        <option value="Documentary">Documentaries</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>Recently Watched & Loved Shows / Movies</label>
                    <input type="text" id="reg-history" placeholder="e.g., Breaking Bad, Avenida Brasil, Interstellar...">
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="button" id="submit-register-btn" class="gold-btn" style="margin-top: 25px;">Complete VIP Registration & Login</button>
            </form>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
