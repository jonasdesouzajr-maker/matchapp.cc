<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match App | My VIP Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- 🌍 ANIMATED LUXURY BACKGROUND -->
    <div class="luxury-bg"><div class="floating-orb orb-1"></div><div class="floating-orb orb-2"></div></div>

    <div class="container" style="margin-top: 40px;">
        
        <!-- ✨ COMPACT HEADER FOR NAVIGATION -->
        <header class="app-header fade-in" style="margin-bottom: 30px; justify-content: center;">
            <a href="index.html" class="header-brand-area" style="text-decoration: none;">
                <div class="brand-text-container" style="text-align: center;">
                    <span class="app-title-main" style="font-size: 24px;">MatchApp</span>
                    <span class="app-author">Dashboard Return</span>
                </div>
            </a>
        </header>

        <!-- 👤 MAIN PROFILE CARD -->
        <div class="premium-card fade-in" style="padding: 40px 25px;">
            
            <!-- LARGE AVATAR UPLOADER -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <label for="profile-pic-upload" style="position: relative; cursor: pointer; display: inline-block; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <!-- The image ID must exactly match what we built in app.js -->
                    <div style="width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--gold); overflow: hidden; box-shadow: 0 0 30px rgba(212,175,55,0.4);">
                        <img id="profile-pic-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23D4AF37'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <!-- Premium Edit Badge -->
                    <div style="position: absolute; bottom: 5px; right: 5px; background: #fff; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 2px solid var(--gold); font-size: 16px;">
                        ✏️
                    </div>
                </label>
                <!-- Hidden file input using the global app.js function -->
                <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;" onchange="handleProfilePic(event)">
            </div>

            <!-- USER DETAILS -->
            <h2 style="color: #fff; margin: 0 0 10px 0; font-size: 26px;">My Account</h2>
            <p id="user-email-display" style="color: var(--text-muted); font-size: 15px; margin-top: 0; margin-bottom: 15px;">Loading secure data...</p>
            
            <!-- STATUS BADGES -->
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 35px;">
                <span id="free-badge" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #ccc; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; letter-spacing: 1px;">FREE ACCOUNT</span>
                <span id="vip-badge" style="display: none; background: linear-gradient(135deg, #BF953F, #FBF5B7); color: #000; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 900; letter-spacing: 1px; box-shadow: 0 0 15px rgba(212,175,55,0.5);">💎 VIP AD-FREE ACTIVE</span>
            </div>

            <!-- 🎬 PORTFOLIO SECTION -->
            <div style="text-align: left; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
                <h3 style="color: var(--gold); margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 10px;">⭐ Saved Portfolio</h3>
                
                <div id="portfolio-grid">
                    <!-- Default empty state -->
                    <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin: 20px 0;">You haven't saved any matches yet.<br>Go find your first perfect vibe!</p>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 30px;">
                <button onclick="window.location.href='index.html'" class="gold-btn">🎬 Return to Concierge</button>
                <button onclick="doLogout()" class="secondary-btn" style="border-color: #ff5252; color: #ff5252; background: rgba(255,82,82,0.1);">Log Out Safely</button>
            </div>
        </div>
    </div>

    <!-- Load the main app logic -->
    <script src="app.js"></script>
    
    <!-- Local Profile Renderer -->
    <script>
        // We wait a brief moment for app.js to initialize the Supabase session
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                // 1. Fetch exact email from the server
                if (window.isUserLoggedIn && window.supabaseClient) {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session && session.user) {
                        document.getElementById('user-email-display').innerText = session.user.email;
                    }
                    
                    // 2. Toggle VIP badge if they bought a package
                    if (window.isVIP || window.isAdFree) {
                        document.getElementById('vip-badge').style.display = 'inline-block';
                        document.getElementById('free-badge').style.display = 'none';
                    }
                } else {
                    document.getElementById('user-email-display').innerText = "Unregistered Guest Account";
                }

                // 3. Render the Saved Movies dynamically from app.js memory
                const portfolioGrid = document.getElementById('portfolio-grid');
                if (window.savedList && window.savedList.length > 0) {
                    portfolioGrid.innerHTML = ''; // Clear the empty message
                    
                    // Loop through their saved array and create nice UI boxes
                    window.savedList.forEach(title => {
                        portfolioGrid.innerHTML += `
                            <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.2); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; transition: transform 0.2s;">
                                <strong style="color: #fff; font-size: 15px;">${title}</strong>
                                <span style="background: rgba(212,175,55,0.15); color: var(--gold); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold;">SAVED</span>
                            </div>
                        `;
                    });
                }
            }, 800); // 800ms delay ensures app.js variables are fully populated first
        });
    </script>
</body>
</html>
