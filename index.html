<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatchApp | The Premium Streaming Concierge</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ECND229RR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2ECND229RR');
    </script>

    <!-- AUTO-DETECT DEVICE LANGUAGE SCRIPT -->
    <script>
        (function autoSetLanguage() {
            if (!document.cookie.includes('googtrans')) {
                let userLang = (navigator.language || navigator.userLanguage).split('-')[0];
                const supported = ['en','zh-CN','hi','es','fr','ar','bn','ru','pt','ur','id'];
                if(supported.includes(userLang) && userLang !== 'en'){
                    document.cookie = `googtrans=/en/${userLang}; path=/`;
                }
            }
        })();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9541435081010948" crossorigin="anonymous"></script>
</head>
<body>
    <div class="luxury-bg"></div>
    <div id="toast-container"></div>

    <div class="container">
        
        <header class="app-header">
            <div class="logo" id="dev-reset-btn" title="Click to reset limit">Match<span>App</span></div>
            <div class="translate-wrapper" id="google_translate_element"></div>
        </header>

        <!-- TOP AD: Adsterra 728x90 -->
        <div class="ad-wrapper-top">
            <script>
                atOptions = { 'key' : '0ffd8484dc13e2d5967d0d70f61fc753', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script src="https://www.highperformanceformat.com/0ffd8484dc13e2d5967d0d70f61fc753/invoke.js"></script>
        </div>

        <div class="rule-banner" id="rule-banner">
            <p>✨ <strong>First Match is FREE!</strong> Register below to unlock unlimited concierge access.</p>
        </div>

        <!-- LOGIN BOX -->
        <div id="auth-section" class="premium-card auth-box">
            <h3>🔐 Member Login</h3>
            <input type="email" id="login-email" placeholder="Email address">
            <input type="password" id="login-password" placeholder="Password">
            <div class="auth-buttons">
                <button class="secondary-btn" type="button" onclick="window.location.href='register.html'">Create VIP Profile</button>
                <button id="login-btn" class="primary-btn" type="button">Log In</button>
            </div>
        </div>

        <!-- USER DASHBOARD -->
        <div id="user-info-section" class="hidden premium-card auth-box">
            <h3 id="user-greeting">✨ Welcome back!</h3>
            <p id="user-profile-meta" style="font-size: 12px; color: #A0A0B5; margin-bottom: 15px;"></p>
            <button id="logout-btn" class="secondary-btn" type="button" style="width: 100%;">Log Out</button>
        </div>

        <!-- MAIN QUESTIONNAIRE -->
        <div class="premium-card bubble-container">
            <div id="questionnaire-screen" style="padding: 25px;">
                <h1 class="card-title">Find Your Perfect Watch</h1>
                <p class="subtitle">Let our concierge algorithm curate your night.</p>
                
                <form id="match-form">
                    <div class="input-grid">
                        <div class="input-group">
                            <label>Age (Min 16)</label>
                            <input type="number" id="age" min="16" max="120" placeholder="e.g., 28" required>
                        </div>
                        <div class="input-group">
                            <label>Country</label>
                            <input type="text" id="country" placeholder="e.g., USA" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Format</label>
                        <select id="format">
                            <option value="movie">Movie</option>
                            <option value="series">Series</option>
                            <option value="telenovela">Telenovela</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Current Mood</label>
                        <select id="mood">
                            <option value="drama">Deep Drama</option>
                            <option value="comedy">Comedy / Laughs</option>
                            <option value="action">Action / Thriller</option>
                            <option value="scifi">Sci-Fi / Fantasy</option>
                            <option value="romance">Romance</option>
                        </select>
                    </div>

                    <div class="input-grid">
                        <div class="input-group">
                            <label>Era</label>
                            <select id="era">
                                <option value="modern">Modern (2010+)</option>
                                <option value="classic">Classic (Pre-2010)</option>
                                <option value="any">Any Era</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Audio</label>
                            <select id="langpref">
                                <option value="subtitled">Subtitled</option>
                                <option value="dubbed">Dubbed</option>
                                <option value="english">English Original</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Platform</label>
                        <select id="platform">
                            <option value="any">Anywhere (Best Match)</option>
                            <option value="Netflix">Netflix</option>
                            <option value="Max">Max</option>
                            <option value="Prime Video">Prime Video</option>
                            <option value="Disney+">Disney+</option>
                            <option value="Globoplay">Globoplay</option>
                            <option value="Apple TV+">Apple TV+</option>
                        </select>
                    </div>

                    <!-- AGE WARNING BANNER -->
                    <div id="age-error-banner" class="hidden" style="background: #2a1215; border: 1px solid #ff5252; color: #ff8787; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; margin-top: 15px;">
                        ⚠️ You must be at least 16 years old to use MatchApp.
                    </div>

                    <button type="submit" id="submit-match-btn" class="gold-btn">Curate My Match</button>
                </form>

                <!-- ADSTERRA NATIVE BANNER -->
                <div class="ad-spacing">
                    <script async="async" data-cfasync="false" src="https://pl30907929.effectivecpmnetwork.com/24c070776b5f8b41dda874f495a807d2/invoke.js"></script>
                    <div id="container-24c070776b5f8b41dda874f495a807d2"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ 
                pageLanguage: 'en', 
                includedLanguages: 'en,zh-CN,hi,es,fr,ar,bn,ru,pt,ur,id',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE 
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="app.js"></script>
</body>
</html>
