<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ECND229RR"></script>
    <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-2ECND229RR');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match App | Your Streaming Concierge</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9541435081010948" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="luxury-bg"><div class="floating-orb orb-1"></div><div class="floating-orb orb-2"></div></div>

    <div class="container">
        
        <div id="chrome-banner" class="chrome-banner fade-in">
            <div class="chrome-text">For the best experience, open in Chrome.</div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button onclick="openInChrome()" class="chrome-btn">Open Chrome</button>
                <span class="close-x" style="position: relative; top:0; right:0; font-size: 20px; color: #fff;" onclick="dismissChromeBanner()">×</span>
            </div>
        </div>

        <div class="ad-placement fade-in">
            <span style="font-size: 9px; color: #666; display: block; margin-bottom: 5px; font-weight: bold;">SPONSORED ADVERTISEMENT</span>
            <div class="ad-scale-wrapper">
                <script>atOptions = { 'key' : '0ffd8484dc13e2d5967d0d70f61fc753', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };</script>
                <script src="https://www.highperformanceformat.com/0ffd8484dc13e2d5967d0d70f61fc753/invoke.js"></script>
            </div>
        </div>

        <header class="app-header fade-in">
            <a href="index.html" class="header-brand-area">
                <picture><source srcset="logo.jpeg" type="image/jpeg"><img src="logo.jpeg" alt="Logo" class="brand-logo"></picture>
                <div class="brand-text-container">
                    <span class="app-title-main">MatchApp</span>
                    <span class="app-title-sub">Your streaming concierge</span>
                    <span class="app-author">By Jonas Junior</span>
                </div>
            </a>
            
            <div id="header-auth-area" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
                <label for="profile-pic-upload" id="profile-pic-container" class="profile-pic-container">
                    <img id="profile-pic-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24' fill='%23D4AF37'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Avatar">
                </label>
                <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;" onchange="handleProfilePic(event)">

                <button id="profile-link-tab" onclick="window.location.href='profile.html'" style="display: none; background: rgba(212,175,55,0.2); border: 1px solid var(--gold); color: var(--gold-glow); padding: 10px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;">👤 My Profile</button>
                <button id="nav-upgrade-btn" onclick="window.location.href='pricing.html'" class="gold-btn" style="padding: 10px 15px; width: auto; font-size: 12px; border: 1px solid #fff;">💎 Get VIP Status</button>
                <button id="nav-reg-btn" onclick="signInWithGoogle()" class="gold-btn" style="padding: 10px 15px; width: auto; font-size: 12px; background: #fff; color: #000;">Sign In With Google</button>
                <button id="nav-logout-btn" onclick="doLogout()" style="display: none; background: transparent; color: #ff5252; border: 1px solid #ff5252; padding: 10px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;">Log Out</button>
            </div>
        </header>
        
        <div id="questionnaire-box" class="premium-card fade-in">
            <h2 style="margin: 0 0 15px 0; font-size: 32px; color: var(--gold);">Find Your Vibe</h2>
            <div class="input-grid">
                <div class="input-group"><label>Format</label><select id="q-category"><option value="any">Surprise Me</option><option value="movie">Movies</option></select></div>
                <div class="input-group"><label>Platform</label><select id="q-platform"><option value="any">Any Platform</option><option value="Netflix">Netflix</option></select></div>
                <div class="input-group"><label>Mood</label><select id="q-mood"><option value="any">Any</option><option value="relax">Relaxed</option></select></div>
                <div class="input-group"><label>Aesthetic</label><select id="q-aesthetic"><option value="any">Any Vibe</option><option value="dark">Dark & Gritty</option></select></div>
            </div>
            <button onclick="triggerMatch()" class="gold-btn" style="margin-top: 25px;">⚡ Curate My Match</button>
        </div>

        <div id="loading-box" class="premium-card fade-in" style="display: none; padding: 70px 20px;">
            <div style="font-size: 60px; margin-bottom: 20px;">🔮</div>
            <h3 style="color: var(--gold-glow); font-size: 24px; margin-bottom: 12px;">Consulting the Algorithm...</h3>
        </div>

        <div id="result-box" class="premium-card cinematic-result fade-in" style="display: none;">
            <div id="res-header-bg" class="cinematic-header"><div class="cinematic-overlay"></div><div class="cinematic-title-box"><h2 id="res-title" class="cinematic-title">Title</h2></div></div>
            <div class="cinematic-body">
                <p id="res-synopsis" style="color: #ddd; font-size: 16px; text-align: left; margin-bottom: 25px;"></p>
                <iframe id="res-trailer" style="width: 100%; height: 280px; border-radius: 16px; margin-bottom: 25px;" src="" frameborder="0" allowfullscreen></iframe>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <button onclick="saveToList()" class="secondary-btn" style="flex: 1; border-color: var(--gold); color: var(--gold);">⭐ Save</button>
                    <button onclick="location.reload()" class="secondary-btn" style="flex: 1;">🔄 Dashboard</button>
                </div>
            </div>
        </div>

        <footer class="app-footer fade-in">
            <div class="ad-placement" style="background: transparent; border-radius: 0; padding-top:20px;">
                <span style="font-size: 10px; color: #888; display: block; margin-bottom: 15px; text-align: center; font-weight: bold;">SPONSORED CONTENT</span>
                <div style="display: flex; justify-content: center; margin-bottom: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);">
                    <script>atOptions = { 'key' : 'a993f73724a261dce748b6f9319072d5', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };</script>
                    <script src="https://www.highperformanceformat.com/a993f73724a261dce748b6f9319072d5/invoke.js"></script>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- 🛑 THE FIX: Link points directly to pricing.html -->
    <div id="adblock-modal" class="modal-overlay">
        <div class="premium-card modal-content" style="border: 2px solid #ff5252; background: rgba(20,5,5,0.95);">
            <div style="font-size: 65px; margin-bottom: 20px;">🛑</div>
            <h2 style="color: #ff5252; font-size: 32px; margin-top:0;">Ad-Blocker Detected</h2>
            <p style="color: #fff; font-size: 15px;">Access is blocked while ad-blockers are active.</p>
            <button onclick="location.reload()" class="gold-btn" style="background: #ff5252; color: #fff; padding: 20px; margin-bottom:15px;">🔄 I Disabled It - Reload</button>
            <button onclick="window.location.href='pricing.html'" class="secondary-btn" style="border-color: var(--gold); color: var(--gold);">Or Purchase VIP Ad-Free</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
