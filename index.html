<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchApp | The Premium Streaming Concierge</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ECND229RR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2ECND229RR');
    </script>
    
    <!-- Supabase Database CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9541435081010948" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Animated Luxury Background -->
    <div class="luxury-bg"></div>

    <div class="container">
        
        <!-- HEADER -->
        <header class="app-header">
            <!-- Dev Reset Trick -->
            <div class="logo" id="dev-reset-btn" title="Click to reset limit">Match<span>App</span></div>
            <div class="translate-wrapper" id="google_translate_element"></div>
        </header>

        <!-- TOP AD: Adsterra 728x90 -->
        <div class="ad-wrapper-top">
            <script>
                atOptions = {
                    'key' : '0ffd8484dc13e2d5967d0d70f61fc753',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                };
            </script>
            <script src="https://www.highperformanceformat.com/0ffd8484dc13e2d5967d0d70f61fc753/invoke.js"></script>
        </div>

        <!-- FREEMIUM BANNER -->
        <div class="rule-banner" id="rule-banner">
            <p>✨ <strong>First Match is FREE!</strong> Register below to unlock your daily unlimited concierge access.</p>
        </div>

        <!-- AUTHENTICATION SECTION -->
        <div id="auth-section" class="premium-card auth-box">
            <h3>VIP Access</h3>
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" required>
            <div class="auth-buttons">
                <button id="register-btn" class="secondary-btn">Register</button>
                <button id="login-btn" class="primary-btn">Log In</button>
            </div>
            <p id="auth-message"></p>
        </div>

        <!-- LOGGED IN SECTION -->
        <div id="user-info-section" class="hidden premium-card auth-box">
            <p id="user-info"></p>
            <button id="logout-btn" class="secondary-btn">Log Out</button>
        </div>

        <!-- MAIN INTERACTIVE BUBBLE -->
        <div class="premium-card bubble-container">
            
            <!-- STATE 1: QUESTIONNAIRE -->
            <div id="questionnaire-screen">
                <h1 class="card-title">Find Your Perfect Watch</h1>
                <p class="subtitle">Let our concierge algorithm curate your night.</p>
                
                <form id="match-form">
                    <div class="input-grid">
                        <div class="input-group">
                            <label>Age</label>
                            <input type="number" id="age" min="1" max="120" placeholder="e.g., 28" required>
                        </div>
                        <div class="input-group">
                            <label>Country</label>
                            <input type="text" id="country" placeholder="e.g., USA" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Format</label>
                        <select id="format">
                            <option value="movie">Movie</option>
                            <option value="series">Series</option>
                            <option value="telenovela">Telenovela</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Current Mood</label>
                        <select id="mood">
                            <option value="drama">Deep Drama</option>
                            <option value="comedy">Comedy / Laughs</option>
                            <option value="action">Action / Thriller</option>
                            <option value="scifi">Sci-Fi / Fantasy</option>
                            <option value="romance">Romance</option>
                        </select>
                    </div>

                    <div class="input-grid">
                        <div class="input-group">
                            <label>Era</label>
                            <select id="era">
                                <option value="modern">Modern (2010+)</option>
                                <option value="classic">Classic (Pre-2010)</option>
                                <option value="any">Any Era</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Audio</label>
                            <select id="langpref">
                                <option value="subtitled">Subtitled</option>
                                <option value="dubbed">Dubbed</option>
                                <option value="english">English Original</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Platform</label>
                        <select id="platform">
                            <option value="any">Anywhere (Best Match)</option>
                            <option value="Netflix">Netflix</option>
                            <option value="Max">Max</option>
                            <option value="Prime Video">Prime Video</option>
                            <option value="Disney+">Disney+</option>
                            <option value="Globoplay">Globoplay</option>
                            <option value="Apple TV+">Apple TV+</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-match-btn" class="gold-btn">Curate My Match</button>
                </form>

                <!-- ADSTERRA NATIVE BANNER -->
                <div class="ad-spacing">
                    <script async="async" data-cfasync="false" src="https://pl30907929.effectivecpmnetwork.com/24c070776b5f8b41dda874f495a807d2/invoke.js"></script>
                    <div id="container-24c070776b5f8b41dda874f495a807d2"></div>
                </div>
            </div>

            <!-- STATE 2: LOADING BAR -->
            <div id="loading-screen" class="hidden loading-bubble">
                <div class="loading-icon">🍿</div>
                <h2 id="loading-text">Analyzing your preferences...</h2>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
                
                <!-- ADSTERRA 300x250 INTERSTITIAL -->
                <div class="ad-wrapper-loading">
                    <script>
                        atOptions = {
                            'key' : 'a993f73724a261dce748b6f9319072d5',
                            'format' : 'iframe',
                            'height' : 250,
                            'width' : 300,
                            'params' : {}
                        };
                    </script>
                    <script src="https://www.highperformanceformat.com/a993f73724a261dce748b6f9319072d5/invoke.js"></script>
                </div>
            </div>

            <!-- STATE 3: RESULT BUBBLE -->
            <div id="result-screen" class="hidden result-bubble">
                <button id="close-bubble-btn" class="close-x">&times;</button>
                
                <div class="result-poster-wrapper">
                    <img id="result-poster" src="" alt="Poster">
                    <div class="poster-vignette"></div>
                </div>

                <div class="result-content">
                    <div class="gold-badge-header">✨ Your Curated Match</div>
                    <h2 id="result-title">Title</h2>
                    
                    <div class="meta-tags">
                        <span id="result-imdb" class="meta-tag">⭐</span>
                        <span id="result-length" class="meta-tag">⏱️</span>
                        <span id="result-age" class="meta-tag">🔞</span>
                    </div>

                    <p id="result-desc" class="result-desc"></p>
                    
                    <div class="streaming-info-box">
                        <h4>📺 Streaming in <span id="result-country"></span>:</h4>
                        <p id="result-platform" class="platform-text"></p>
                        <p id="result-audio" class="audio-text"></p>
                    </div>

                    <!-- SOCIAL SHARE -->
                    <div class="social-box">
                        <p>📤 Share your match:</p>
                        <div class="social-grid">
                            <button id="share-wa" class="s-btn wa">WhatsApp</button>
                            <button id="share-x" class="s-btn xx">X</button>
                            <button id="share-fb" class="s-btn fb">Facebook</button>
                            <button id="share-more" class="s-btn more">More...</button>
                        </div>
                    </div>

                    <!-- GOOGLE ADSENSE -->
                    <div class="ad-spacing">
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-client="ca-pub-9541435081010948"
                             data-ad-slot="3127478321"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                        <script>
                             (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="app.js"></script>
</body>
</html>
