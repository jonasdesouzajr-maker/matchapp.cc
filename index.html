<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchApp | The Premium Streaming Concierge</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="luxury-bg"></div>

    <div class="container" style="max-width: 500px; margin: 30px auto; padding: 20px; position: relative; z-index: 1;">
        
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="font-size: 24px; font-weight: 800; color: #fff;">Match<span style="color: #D4AF37;">App</span></div>
            <button onclick="window.location.href='register.html'" style="background: #D4AF37; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Register VIP</button>
        </header>

        <!-- QUESTIONNAIRE BOX -->
        <div id="questionnaire-box" style="background: rgba(20,20,35,0.9); border: 1px solid rgba(212,175,55,0.3); padding: 25px; border-radius: 16px;">
            <h2 style="color: #fff; margin-top: 0;">Find Your Match</h2>
            <p style="color: #A0A0B5; font-size: 13px;">Select your preferences below:</p>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase; font-weight: bold;">Age (Min 16)</label>
                <input type="number" id="input-age" value="25" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase; font-weight: bold;">Country</label>
                <input type="text" id="input-country" value="Brazil" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase; font-weight: bold;">Format</label>
                <select id="input-format" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                    <option value="telenovela">Telenovela</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: #A0A0B5; font-size: 11px; text-transform: uppercase; font-weight: bold;">Mood</label>
                <select id="input-mood" style="width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
                    <option value="drama">Deep Drama</option>
                    <option value="comedy">Comedy</option>
                    <option value="action">Action / Thriller</option>
                    <option value="scifi">Sci-Fi</option>
                    <option value="romance">Romance</option>
                </select>
            </div>

            <!-- DIRECT INLINE CLICK HANDLER -->
            <button onclick="triggerMatch()" style="width: 100%; background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728); color: #000; border: none; padding: 14px; font-weight: 800; border-radius: 8px; cursor: pointer;">⚡ Curate My Match</button>
        </div>

        <!-- RESULT BOX -->
        <div id="result-box" style="display: none; background: rgba(20,20,35,0.95); border: 2px solid #D4AF37; padding: 25px; border-radius: 16px; margin-top: 20px;">
            <div style="color: #D4AF37; font-size: 11px; font-weight: bold; text-transform: uppercase;">✨ Curated Match Found</div>
            <h2 id="res-title" style="color: #fff; margin: 5px 0 15px 0; font-size: 24px;">Title</h2>
            
            <img id="res-poster" src="" alt="Poster" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px;">
            
            <p id="res-desc" style="color: #A0A0B5; font-size: 13px; line-height: 1.5; margin-bottom: 15px;"></p>
            
            <div style="background: rgba(212,175,55,0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                <div style="font-size: 11px; color: #A0A0B5; text-transform: uppercase;">Where to Watch:</div>
                <div id="res-platform" style="color: #fff; font-weight: 800; font-size: 16px; margin-top: 3px;">Netflix</div>
            </div>

            <button onclick="location.reload()" style="width: 100%; background: #333; color: #fff; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer;">🔄 Search Again</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
